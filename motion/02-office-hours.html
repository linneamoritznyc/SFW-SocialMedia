<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Motion 02, office hours</title><link rel="stylesheet" href="_motion.css">
<!-- PRIORITY 2. 1080x1920. 7.8 second loop.
     No office hours footage exists. This is the title sequence that wraps
     around it once it does, and it stands alone until then.
     Source Sans carries the body, Montserrat the two numbers. No quote. -->
<style>
 .stage{background:var(--panel)}
 .slab{position:absolute;left:-60px;top:250px;width:760px;height:560px;background:var(--green);
   transform:rotate(-1.4deg)}
 .k{position:absolute;top:296px;left:78px;font-family:var(--display);font-weight:700;font-size:30px;
   letter-spacing:.2em;text-transform:uppercase;color:var(--glow);z-index:3;
   opacity:0;animation:rise .45s ease-out .15s forwards}
 h1{position:absolute;top:352px;left:78px;width:560px;font-family:var(--display);font-weight:700;
   font-size:82px;line-height:1.02;color:#fff;letter-spacing:-.03em;z-index:3;
   opacity:0;animation:rise .55s cubic-bezier(.2,.75,.3,1) .4s forwards}

 /* Two numbers, deliberately not aligned to each other. */
 .a{position:absolute;left:96px;top:900px}
 .b{position:absolute;left:430px;top:1128px}
 .a .n,.b .n{font-family:var(--display);font-weight:700;line-height:.84;color:var(--green);
   letter-spacing:-.05em}
 .a .n{font-size:300px;counter-reset:n var(--n);opacity:0;
   animation:rise .5s cubic-bezier(.2,.8,.3,1) 1.15s forwards}
 .a .n::after{content:counter(n)}
 .b .n{font-size:196px;counter-reset:h var(--n);opacity:0;
   animation:riseLate .8s cubic-bezier(.16,.95,.3,1) 3.2s forwards, count60 1.9s linear 3.3s forwards}
 .b .n::after{content:counter(h)}
 @keyframes count60{from{--n:0}to{--n:60}}
 .a .n{animation:rise .5s cubic-bezier(.2,.8,.3,1) 1.15s forwards, count1 .3s linear 1.15s forwards}
 @keyframes count1{from{--n:0}to{--n:1}}
 .lab{font-family:var(--sans);font-size:38px;line-height:1.25;color:var(--ink);margin-top:6px;
   max-width:14ch;opacity:0}
 .a .lab{animation:rise .4s ease-out 1.7s forwards}
 .b .lab{animation:rise .4s ease-out 4.7s forwards}

 .rule{position:absolute;left:96px;top:1084px;width:0;height:4px;background:var(--soil);
   animation:grow .7s cubic-bezier(.2,.8,.3,1) 2.6s forwards}
 @keyframes grow{to{width:540px}}

 .foot{position:absolute;left:78px;right:150px;bottom:312px;opacity:0;
   animation:rise .5s ease-out 5.9s forwards}
 .foot p{font-family:var(--sans);font-size:36px;line-height:1.32;color:var(--ink-soft)}
 .foot b{display:block;font-family:var(--display);font-weight:700;font-size:34px;color:var(--green);margin-top:14px}
 .stage{animation:loop 7.8s infinite}
 @keyframes loop{0%,93%{opacity:1}98%,100%{opacity:0}}
</style></head><body><div class="stage">
 <div class="slab"></div>
 <div class="zone"><em>interface</em></div><div class="zone b"><em>interface</em></div>
 <p class="k">Office hours</p>
 <h1>She came with one question.</h1>
 <div class="a"><p class="n"></p><p class="lab">question, arriving</p></div>
 <div class="rule"></div>
 <div class="b"><p class="n"></p><p class="lab">minutes later, still there</p></div>
 <div class="foot"><p>Three times a week. Carla runs them. Almost nobody leaves at the fifteen minute mark.</p>
   <b>Follow for what students actually ask.</b></div>
</div></body></html>
