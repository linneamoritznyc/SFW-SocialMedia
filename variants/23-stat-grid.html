<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Field Notes 23, the season in four numbers</title><link rel="stylesheet" href="_tokens.css">
<style>
 .frame{background:var(--green);padding:74px 78px;display:flex;flex-direction:column}
 .top{display:flex;justify-content:space-between;align-items:baseline}
 .season{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.1em;color:rgba(255,255,255,.72)}
 h1{font-family:var(--display);font-weight:700;font-size:66px;line-height:1.08;color:#fff;
   margin-top:18px;max-width:14ch;letter-spacing:-.02em}
 .grid{margin-top:34px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
 .c{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.22);border-radius:20px;
   padding:30px 32px}
 .c b{display:block;font-family:var(--display);font-weight:700;font-size:96px;line-height:.95;color:var(--glow);
   letter-spacing:-.03em}
 .c span{display:block;font-family:var(--sans);font-size:34px;line-height:1.3;
   color:rgba(255,255,255,.9);margin-top:12px}
 .foot{margin-top:auto;padding-top:26px;display:flex;justify-content:space-between;align-items:flex-end;gap:22px}
 .who{font-family:var(--display);font-weight:700;font-size:38px;color:var(--glow)}
 .who span{display:block;font-family:var(--sans);font-weight:400;font-size:32px;color:rgba(255,255,255,.84);margin-top:3px}
 .src{color:rgba(255,255,255,.62);text-align:right;max-width:24ch}
</style></head><body><div class="frame">
 <div class="top"><span class="eyebrow eyebrow--light">Field notes</span>
   <span class="season" data-field="season">2026 season</span></div>
 <h1>One season, in four numbers</h1>
 <div class="grid">
  <div class="c" data-field="hero-number"><b>20</b><span>years the ground sat fallow</span></div>
  <div class="c" data-field="soil-result"><b>46%</b><span>organic matter gained on compost</span></div>
  <div class="c"><b>14%</b><span>gained on water alone</span></div>
  <div class="c" data-field="crop-result"><b>35oz</b><span>squash, against 19 on the control</span></div>
 </div>
 <div class="foot"><p class="who"><span data-field="name">Sandra Niggemeyer</span><span data-field="place">Van, Texas</span></p>
   <p class="src">Her field trial report, 2026.</p></div>
</div></body></html>
