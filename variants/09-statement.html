<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Field Notes 09, statement</title><link rel="stylesheet" href="_tokens.css">
<style>
 .frame{background:var(--glow);padding:84px 88px;display:flex;flex-direction:column}
 .top{display:flex;justify-content:space-between;align-items:baseline}
 .eyebrow{color:var(--moss)}
 .season{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:.1em;color:var(--olive)}
 h1{font-family:var(--display);font-weight:700;font-size:104px;line-height:.98;color:var(--moss);
    margin-top:auto;letter-spacing:-.03em;max-width:11ch}
 h1 em{font-style:normal;color:var(--green)}
 .sub{font-family:var(--text-serif);font-size:40px;line-height:1.3;color:var(--soil);
   margin-top:28px;max-width:24ch}
 .foot{margin-top:auto;padding-top:34px;border-top:3px solid rgba(34,55,31,.25);display:flex;
   justify-content:space-between;align-items:flex-end;gap:20px}
 .who{font-family:var(--display);font-weight:700;font-size:30px;color:var(--moss)}
 .who span{display:block;font-family:var(--sans);font-weight:400;font-size:24px;color:var(--olive);margin-top:2px}
 .src{font-family:var(--sans);font-size:17px;color:var(--olive);text-align:right;max-width:30ch}
</style></head><body><div class="frame">
 <div class="top"><span class="eyebrow">Field notes</span><span class="season" data-field="season">2026 season</span></div>
 <h1 data-field="test-question">In degraded soil, the first season is <em>the ground.</em></h1>
 <p class="sub" data-field="soil-result">Not the yield. Her compost plot gained 46% organic matter. The harvest was two pounds of squash.</p>
 <div class="foot"><p class="who"><span data-field="name">Sandra Niggemeyer</span><span data-field="place">Van, Texas</span></p>
   <p class="src">Her own conclusion, from her field trial report, 2026.</p></div>
</div></body></html>
