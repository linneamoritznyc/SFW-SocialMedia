<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Field Notes 09, statement</title><link rel="stylesheet" href="_tokens.css">
<style>
 .frame{background:var(--glow);display:flex;flex-direction:column}
 .shot{height:44%;position:relative;overflow:hidden}
 .shot img{width:100%;height:100%;object-fit:cover}
 .shot::after{content:"";position:absolute;inset:0;
   background:linear-gradient(to bottom,rgba(20,32,18,.48),rgba(20,32,18,0) 46%,rgba(219,230,167,.28) 92%,var(--glow) 100%)}
 .top{position:absolute;top:44px;left:78px;right:78px;display:flex;justify-content:space-between;
   align-items:baseline;z-index:3}
 .top .eyebrow{color:#fff}
 .season{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.08em;color:rgba(255,255,255,.88)}
 .body{flex:1;padding:22px 78px 62px;display:flex;flex-direction:column}
 h1{font-family:var(--display);font-weight:700;font-size:88px;line-height:1;color:var(--moss);
   letter-spacing:-.03em;max-width:12ch}
 h1 em{font-style:normal;color:var(--green)}
 .sub{font-family:var(--text-serif);font-size:38px;line-height:1.28;color:var(--soil);
   margin-top:20px;max-width:26ch}
 .foot{margin-top:auto;padding-top:22px;border-top:3px solid rgba(34,55,31,.25);display:flex;
   justify-content:space-between;align-items:flex-end;gap:20px}
 .who{font-family:var(--display);font-weight:700;font-size:32px;color:var(--moss)}
 .who span{display:block;font-family:var(--sans);font-weight:400;font-size:28px;color:var(--olive);margin-top:2px}
 .src{font-family:var(--sans);font-size:28px;line-height:1.35;color:var(--olive);text-align:right;max-width:24ch}
</style></head><body><div class="frame">
 <div class="shot"><img src="../assets/photo/red-soil-hand.jpg"
   alt="An open palm resting on deep red soil, the same soil in the creases of the fingers."></div>
 <div class="top"><span class="eyebrow">Field notes</span><span class="season" data-field="season">2026 season</span></div>
 <div class="body">
  <h1 data-field="test-question">In degraded soil, the first season is <em>the ground.</em></h1>
  <p class="sub" data-field="soil-result">Not the yield. Her compost plot gained 46% organic matter. The harvest was two pounds of squash.</p>
  <div class="foot"><p class="who"><span data-field="name">Sandra Niggemeyer</span><span data-field="place">Van, Texas</span></p>
    <p class="src">Her own conclusion, from her field trial report, 2026.</p></div>
 </div>
</div></body></html>
