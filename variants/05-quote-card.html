<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Field Notes 05, quote card</title>
<link rel="stylesheet" href="_tokens.css">
<!-- SWAPPABLE FIELDS, identical in all seven. -->
<style>
  .frame { background:var(--scope); padding:0; }
  .bg { position:absolute; inset:0; }
  .bg img { width:100%; height:100%; object-fit:cover; opacity:.30; }
  .bg::after { content:""; position:absolute; inset:0;
    background:radial-gradient(120% 90% at 20% 30%, rgba(34,55,31,.62) 0%, rgba(34,55,31,.92) 62%, rgba(20,32,18,.97) 100%); }
  .inner { position:absolute; inset:0; padding:86px 90px; display:flex; flex-direction:column; }
  .top { display:flex; justify-content:space-between; align-items:baseline; }
  .season { font-family:var(--display); font-weight:600; font-size:24px; letter-spacing:.1em;
            color:rgba(255,255,255,.6); }
  .mark { width:96px; height:5px; background:var(--glow); margin:44px 0 36px; border-radius:3px; }
  blockquote { font-family:var(--text-serif); font-weight:500; font-size:92px; line-height:1.16;
               color:var(--glow); max-width:13ch; }
  .attrib { margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; gap:28px; }
  .who { font-family:var(--display); font-weight:700; font-size:36px; color:#fff; }
  .who span { display:block; font-family:var(--sans); font-weight:400; font-size:27px;
              color:rgba(255,255,255,.80); margin-top:2px; }
  .who span + span { font-size:23px; color:rgba(255,255,255,.58); }
  .num { font-family:var(--display); font-weight:700; font-size:30px; color:var(--glow); text-align:right; }
  .num span { display:block; font-family:var(--sans); font-weight:400; font-size:20px;
              color:rgba(255,255,255,.66); margin-top:7px; }
  .src { margin-top:20px; font-family:var(--sans); font-size:17px; color:rgba(255,255,255,.5); }
</style></head>
<body><div class="frame">
  <div class="bg"><img src="../assets/microscopy/sfw-amoeba-still-square.jpg" alt=""></div>
  <div class="inner">
    <div class="top"><span class="eyebrow eyebrow--light">Field notes</span>
      <span class="season" data-field="season">2026 season</span></div>
    <div class="mark"></div>
    <blockquote>Soil biology rebuilds the ground before it rebuilds the yield.</blockquote>
    <div class="attrib">
      <p class="who"><span data-field="name">Sandra Niggemeyer</span><span data-field="place">Van, Texas</span></p>
      <p class="num" data-field="soil-result">46% / 14% / 1%<span>Organic matter gained.<br>Compost, control, tea.</span></p>
    </div>
    <p class="src">Her own words, from her field trial report, 2026.</p>
  </div>
</div></body></html>
