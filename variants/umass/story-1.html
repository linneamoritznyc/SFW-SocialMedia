<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>UMass story, frame 1</title><link rel="stylesheet" href="../_tokens.css">
<!-- 1080 x 1920. Keep everything readable inside the middle band: the top 250px
     and bottom 280px are covered by the app's own interface. -->
<style>
 .frame--916{background:var(--panel);display:flex;flex-direction:column;
   align-items:center;justify-content:center;text-align:center;padding:90px}
 .zone{position:absolute;left:0;right:0;height:250px;border-bottom:2px dashed rgba(34,55,31,.16)}
 .zone.b{top:auto;bottom:0;height:280px;border-bottom:0;border-top:2px dashed rgba(34,55,31,.16)}
 .zone em{position:absolute;right:26px;bottom:10px;font-family:var(--sans);font-style:normal;
   font-size:20px;color:rgba(34,55,31,.32)}
 .zone.b em{bottom:auto;top:10px}
 .k{position:relative;font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.2em;
   text-transform:uppercase;color:var(--green)}
 .n{position:relative;font-family:var(--display);font-weight:700;font-size:290px;line-height:.9;
   color:var(--green);letter-spacing:-.045em;margin-top:34px}
 .n small{font-size:120px;letter-spacing:-.02em}
 .sub{position:relative;font-family:var(--text-serif);font-size:58px;line-height:1.26;
   color:var(--soil);margin-top:30px;max-width:18ch}
 .src{position:absolute;left:90px;right:90px;bottom:300px;font-family:var(--sans);font-size:28px;
   color:var(--ink-faint);line-height:1.4}
</style></head><body><div class="frame frame--916">
 <div class="zone"><em>app interface, keep clear</em></div>
 <div class="zone b"><em>app interface, keep clear</em></div>
 <p class="k">The bigger picture</p>
 <p class="n"><small>$</small>120<small>M</small></p>
 <p class="sub">into the future of food.</p>
 <p class="src">UMass Amherst news release, 14 September 2026.</p>
</div></body></html>
