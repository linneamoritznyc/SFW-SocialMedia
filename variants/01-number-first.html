<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Field Notes 01, number first</title>
<link rel="stylesheet" href="_tokens.css">
<!-- SWAPPABLE FIELDS, identical in all seven. hero-number, place, headshot,
     test-question, soil-result, crop-result. Plus name and season. -->
<style>
  .frame { background: var(--moss); padding: 78px 84px; display:flex; flex-direction:column;
           overflow:hidden; }
  .bug { position:absolute; right:-130px; top:-90px; width:620px; opacity:.16;
         transform:rotate(-14deg); pointer-events:none; }
  .bug2{ position:absolute; left:-150px; bottom:-60px; width:520px; opacity:.10;
         transform:rotate(22deg); pointer-events:none; }
  .top { display:flex; justify-content:space-between; align-items:baseline; position:relative; }
  .season { font-family:var(--display); font-weight:600; font-size:24px; letter-spacing:.1em;
            color:rgba(255,255,255,.62); }
  .q { position:relative; font-family:var(--text-serif); font-size:44px; line-height:1.28;
       color:#fff; max-width:17ch; margin-top:56px; }
  .hero { position:relative; font-family:var(--display); font-weight:700; color:var(--glow);
          font-size:330px; line-height:.84; letter-spacing:-.04em; margin:22px 0 0 -14px; }
  .hero-sub { position:relative; font-family:var(--display); font-weight:700; font-size:46px;
              line-height:1.2; color:#fff; max-width:17ch; margin-top:16px; }
  .strip { position:relative; margin-top:auto; display:flex; gap:18px; }
  .pill { flex:1; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.22);
          border-radius:14px; padding:20px 24px; }
  .pill b { display:block; font-family:var(--display); font-weight:700; font-size:52px;
            color:#fff; line-height:1; }
  .pill span { display:block; font-family:var(--sans); font-size:22px; margin-top:8px;
               color:rgba(255,255,255,.76); line-height:1.3; }
  .foot { position:relative; margin-top:26px; display:flex; justify-content:space-between;
          align-items:flex-end; gap:24px; }
  .who { font-family:var(--display); font-weight:700; font-size:34px; color:var(--glow); }
  .who span { display:block; font-family:var(--sans); font-weight:400; font-size:26px;
              color:rgba(255,255,255,.82); margin-top:2px; }
  .src { font-family:var(--sans); font-size:17px; line-height:1.4; color:rgba(255,255,255,.55);
         max-width:38ch; text-align:right; }
</style></head>
<body><div class="frame">
  <img class="bug"  src="../assets/microscopy/cutout-2.png" alt="">
  <img class="bug2" src="../assets/microscopy/cutout-5.png" alt="">
  <div class="top"><span class="eyebrow eyebrow--light">Field notes</span>
    <span class="season" data-field="season">2026 season</span></div>
  <p class="q" data-field="test-question">Twenty years fallow. Can biology bring the ground back?</p>
  <div class="hero" data-field="hero-number">46%</div>
  <p class="hero-sub">more organic matter where the compost went in.</p>
  <div class="strip" data-field="soil-result">
    <div class="pill"><b>14%</b><span>Control plot, water only</span></div>
    <div class="pill"><b>1%</b><span>Teas and extracts</span></div>
  </div>
  <div class="foot">
    <p class="who"><span data-field="name">Sandra Niggemeyer</span><span data-field="place">Van, Texas</span></p>
    <p class="src">Source: her field trial report, 2026. One season, three plots, same ground.</p>
  </div>
</div></body></html>
