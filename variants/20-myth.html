<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Field Notes 20, myth and measurement</title><link rel="stylesheet" href="_tokens.css">
<style>
 .frame{display:flex;flex-direction:column}

 <div class="m"><p class="tag">What people say</p><p>Compost is compost.</p></div>
 <div class="f"><p class="tag">What she measured</p>
   <p class="big">46% against 14%, on the same ground.</p>
   <p class="sm">Same field, same season. One plot got biologically complete compost. The control got water.</p></div>
