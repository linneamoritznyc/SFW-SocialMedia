<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Field Notes 25, carousel end card</title><link rel="stylesheet" href="_tokens.css">
<style>
 .frame{background:var(--moss);display:flex;flex-direction:column;align-items:center;
   justify-content:center;text-align:center;padding:92px}
 .bg{position:absolute;inset:0;opacity:.2}
 .bg img{width:100%;height:100%;object-fit:cover}
 .k{position:relative;font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.22em;
   text-transform:uppercase;color:var(--glow)}
 h1{position:relative;font-family:var(--display);font-weight:700;font-size:92px;line-height:1.06;
   color:#fff;margin-top:26px;max-width:12ch;letter-spacing:-.025em}
 .sub{position:relative;font-family:var(--text-serif);font-size:44px;line-height:1.32;
   color:var(--glow);margin-top:28px;max-width:22ch}
 .when{position:relative;margin-top:44px;border:3px solid var(--glow);border-radius:999px;
   padding:18px 46px;font-family:var(--display);font-weight:700;font-size:36px;color:var(--glow)}
 .src{position:absolute;bottom:64px;left:0;right:0;color:rgba(255,255,255,.6)}
</style></head><body><div class="frame">
 <div class="bg"><img src="../assets/microscopy/sfw-amoeba-still-square.jpg" alt=""></div>
 <p class="k">Field notes</p>
 <h1>We publish what the trial found.</h1>
 <p class="sub">Including the seasons that disappoint.</p>
 <p class="when">Every other Thursday</p>
 <p class="src">Soil Food Web Foundation</p>
</div></body></html>
