<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Field Notes 26, three plots</title><link rel="stylesheet" href="_tokens.css">
<style>
 .frame{background:var(--moss);display:flex;flex-direction:column}
 .head{padding:64px 76px 26px;display:flex;justify-content:space-between;align-items:baseline}
 .season{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.1em;color:rgba(255,255,255,.7)}
 h1{padding:0 76px;font-family:var(--display);font-weight:700;font-size:70px;line-height:1.08;
   color:#fff;max-width:15ch;letter-spacing:-.02em}
 .strip{margin-top:34px;flex:1;display:flex;gap:6px}
 .p{flex:1;position:relative;overflow:hidden}
 .p img{width:100%;height:100%;object-fit:cover}
 .p::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,
   rgba(20,32,18,.94) 0%,rgba(20,32,18,.4) 44%,rgba(20,32,18,.1) 100%)}
 .cap{position:absolute;left:24px;right:24px;bottom:28px;z-index:2}
 .cap b{display:block;font-family:var(--display);font-weight:700;font-size:78px;color:var(--glow);line-height:.98}
 .cap span{display:block;font-family:var(--sans);font-size:32px;line-height:1.25;
   color:rgba(255,255,255,.92);margin-top:10px}
 .foot{padding:26px 76px 50px;display:flex;justify-content:space-between;align-items:flex-end;gap:22px}
 .who{font-family:var(--display);font-weight:700;font-size:36px;color:var(--glow)}
 .who span{font-family:var(--sans);font-weight:400;color:rgba(255,255,255,.84)}
 .src{color:rgba(255,255,255,.6);text-align:right;max-width:28ch}
</style></head><body><div class="frame">
 <div class="head"><span class="eyebrow eyebrow--light">Field notes</span>
   <span class="season" data-field="season">2026 season</span></div>
 <h1 data-field="test-question">Three plots, one field</h1>
 <div class="strip" data-field="soil-result">
  <div class="p"><img src="../assets/photo/hand-of-compost.jpg" alt="">
    <div class="cap"><b>46%</b><span>Compost</span></div></div>
  <div class="p"><img src="../assets/microscopy/sfw-teas-still-square.jpg" alt="">
    <div class="cap"><b>1%</b><span>Teas and extracts</span></div></div>
  <div class="p"><img src="../assets/photo/fist-of-dry-soil.jpg" alt="">
    <div class="cap"><b>14%</b><span>Water only</span></div></div>
 </div>
 <div class="foot"><p class="who"><span data-field="name">Sandra Niggemeyer</span>, <span data-field="place">Van, Texas</span></p>
   <p class="src">Organic matter gained. Her report, 2026. Photographs from the Foundation library.</p></div>
</div></body></html>
