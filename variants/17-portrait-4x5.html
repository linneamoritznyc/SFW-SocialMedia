<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Field Notes 17, 4:5 feed post</title><link rel="stylesheet" href="_tokens.css">
<!-- 1080 x 1350. The tallest crop Instagram allows in feed, so it takes the most
     screen on a phone. If only one format gets built, build this one. -->
<style>
 .frame--45{background:var(--moss);display:flex;flex-direction:column}
 .shot{height:52%;position:relative;overflow:hidden}
 .shot img{width:100%;height:100%;object-fit:cover}
 .shot::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,
   rgba(20,32,18,.55) 0%,rgba(20,32,18,0) 34%,rgba(28,44,24,.96) 100%)}
 .head{position:absolute;top:56px;left:76px;right:76px;display:flex;justify-content:space-between;
   align-items:baseline;z-index:4}
 .season{font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:.1em;color:rgba(255,255,255,.8)}
 .body{flex:1;padding:0 76px 64px;margin-top:-90px;position:relative;z-index:3;display:flex;flex-direction:column}
 h1{font-family:var(--display);font-weight:700;font-size:80px;line-height:1.04;color:#fff;
   letter-spacing:-.02em;max-width:13ch}
 .lede{font-family:var(--text-serif);font-size:38px;line-height:1.34;color:var(--glow);margin-top:20px;max-width:26ch}
 .stats{margin-top:32px;display:flex;gap:14px}
 .s{flex:1;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);
   border-radius:16px;padding:20px 22px}
 .s b{display:block;font-family:var(--display);font-weight:700;font-size:48px;color:var(--glow);line-height:1}
 .s span{display:block;font-family:var(--sans);font-size:28px;color:rgba(255,255,255,.8);margin-top:7px;line-height:1.3}
 .foot{margin-top:auto;padding-top:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
 .who{font-family:var(--display);font-weight:700;font-size:34px;color:var(--glow)}
 .who span{display:block;font-family:var(--sans);font-weight:400;font-size:28px;color:rgba(255,255,255,.84);margin-top:2px}
 .src{font-family:var(--sans);font-size:28px;color:rgba(255,255,255,.58);text-align:right;max-width:30ch;line-height:1.4}
</style></head><body><div class="frame frame--45">
 <div class="shot"><img src="../assets/photo/red-soil-hand.jpg" alt="An open palm resting on deep red soil.">
   <div class="head"><span class="eyebrow eyebrow--light">Field notes</span>
     <span class="season" data-field="season">2026 season</span></div></div>
 <div class="body">
   <h1 data-field="test-question">Twenty years fallow.</h1>
   <p class="lede">Three plots on the same Texas ground. Compost, teas, and water only.</p>
   <div class="stats" data-field="soil-result">
     <div class="s"><b>46%</b><span>compost plot</span></div>
     <div class="s"><b>14%</b><span>control</span></div>
     <div class="s"><b>1%</b><span>teas</span></div></div>
   <div class="foot"><p class="who"><span data-field="name">Sandra Niggemeyer</span><span data-field="place">Van, Texas</span></p>
     <p class="src">Organic matter gained. Source: her field trial report, 2026. Photograph from the Foundation library.</p></div>
 </div>
</div></body></html>
