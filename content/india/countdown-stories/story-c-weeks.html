<!-- FRAME C of five. Week 1 and Week 2 as two stacked lines with a thin cream
     rule between them, over the darkest picture in the set, light through storm cloud.
     Colour family: deep green scrim, cream type, Light Green on the labels.
     Light Green is decorative in the brand guide and fails contrast at body
     size; at 44px it clears the 3:1 that large text needs, measured 4.4:1 on
     this scrim, which is why it is here and nowhere smaller.
     Link: school.soilfoodweb.com/courses/india-workshop-2026 -->
<style>
 .frame{--type:var(--cream); --accent:var(--light)}
 .scrim{mix-blend-mode:multiply; background:linear-gradient(to bottom,
   rgba(34,55,31,0) 0%, rgba(34,55,31,0) 26%, rgba(34,55,31,.34) 36%,
   rgba(34,55,31,.66) 46%, rgba(34,55,31,.85) 55%, rgba(34,55,31,.85) 100%)}
</style></head><body><div class="frame">

 <div class="photo"><img src="../../../assets/india-free-images/crops/cymatics-in-pz73YMEi21I-1080x1920.jpg" alt=""></div>
 <div class="scrim"></div>

 <div class="mark"><img src="../../../assets/logo/sfw-foundation-wordmark-cream.png"
   alt="Soil Food Web Foundation"></div>
 <p class="credit">Cymatics</p>

 <div class="copy">
   <p class="week" data-field="week1"><b>Week 1</b>build and monitor compost piles.</p>
   <div class="week-rule"></div>
   <p class="week" data-field="week2"><b>Week 2</b>brew compost teas, extracts and protozoan infusions.</p>
   <p class="partner">with the Isha Foundation and the Conscious Planet Save Soil movement</p>
 </div>

 <div class="zone zone--ui-top"></div>
 <div class="zone zone--countdown"></div>
