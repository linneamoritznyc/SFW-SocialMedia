<!-- EXTENDED DEADLINE OPTION. An alternate for frame A, to run when the
     closing time moves. Never post it alongside A: it carries A's colour
     family, including Harvest Gold, because it is the same frame with a new

     data-field="note" with it and re-run render.js.
     Link: school.soilfoodweb.com/courses/india-workshop-2026 -->
<style>
 .frame{--type:var(--cream); --accent:var(--gold)}
 .scrim{mix-blend-mode:multiply; background:linear-gradient(to bottom,
   rgba(79,52,51,0) 0%, rgba(79,52,51,0) 26%, rgba(79,52,51,.34) 36%,

</style></head><body><div class="frame">
