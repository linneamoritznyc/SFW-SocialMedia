<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Template, favourite microbe</title><link rel="stylesheet" href="../variants/_tokens.css">
<!-- ================================================================
     REUSABLE PEOPLE SLIDE, 1080 x 1080.
     Serves two series with the same layout and four swappable fields:
       Series 1  Favourite microbe
       Series 2  Before Soil Food Web, I was

     THE FOUR SWAPPABLE FIELDS
       1  specimen   the microscopy image, or the "before" object
       2  portrait   their own photograph
       3  who        name and role
       4  line       one line, in their words

     RULES
     - The line is theirs, quoted. If they did not say it, the slide runs
       without a line rather than with one written for them.
     - Both images are required. No stock face, no stock microbe. If we
       hold neither, the person is not ready to post.
     - Spellings, per the meeting note: flagellates, tardigrades,
       rotifers, amoebae, lichens.
     ================================================================ -->
<style>
 .frame{background:var(--moss);display:flex;flex-direction:column}
 .spec{height:54%;position:relative;background:var(--panel-green);overflow:hidden;
   display:flex;align-items:center;justify-content:center}
 .spec img.real{width:100%;height:100%;object-fit:cover}
 .spec img.cut{width:70%}
 .await{position:absolute;top:96px;left:44px;right:44px;bottom:44px;border:4px dashed var(--olive);
   border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
   text-align:center;padding:0 60px;gap:12px}
 .await b{font-family:var(--display);font-weight:700;font-size:38px;color:var(--soil)}
 .await p{font-family:var(--sans);font-size:29px;line-height:1.35;color:var(--ink-soft);max-width:26ch}
 .top{position:absolute;top:40px;left:46px;right:46px;display:flex;justify-content:space-between;
   align-items:baseline;z-index:3}
 .n{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.08em;color:var(--olive)}

 .face{position:absolute;right:56px;bottom:-84px;width:168px;height:168px;border-radius:50%;
   overflow:hidden;border:6px solid var(--moss);background:var(--panel);z-index:4;
   display:flex;align-items:center;justify-content:center}
 .face img{width:100%;height:100%;object-fit:cover}
 .face span{font-family:var(--sans);font-size:24px;color:var(--ink-faint);text-align:center;padding:0 10px}

 .body{flex:1;padding:36px 56px 52px;display:flex;flex-direction:column}
 .name{font-family:var(--display);font-weight:700;font-size:58px;line-height:1.06;color:#fff;
   letter-spacing:-.02em;max-width:13ch}
 .role{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.12em;
   text-transform:uppercase;color:var(--glow);margin-top:10px}
 .line{margin-top:20px;font-family:var(--text-serif);font-size:42px;line-height:1.28;
   color:var(--glow);max-width:26ch}
 .src{margin-top:auto;font-family:var(--sans);font-size:28px;color:rgba(255,255,255,.55);line-height:1.4}
</style></head><body><div class="frame">
 <div class="spec" data-field="specimen">
   <img class="cut" src="../assets/microscopy/cutout-1.png" alt="Testate amoeba, brightfield microscopy.">
   <div class="top"><span class="eyebrow">Favourite microbe</span><span class="n">1 of 10</span></div>
   <div class="face" data-field="portrait"><span>portrait</span>
     <!-- <img src="../assets/photo/PERSON.jpg" alt="..."> --></div>
 </div>
 <div class="body">
   <p class="name" data-field="who">Sammie Bass</p>
   <p class="role">Live events</p>
   <p class="line" data-field="line">"Tardigrades. Debatably."</p>
   <p class="src">Quoted with permission. Microscopy from the Foundation archive.</p>
 </div>
</div></body></html>
